name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: This project is in early development. Thanks for helping to improve it.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.3.0
  - type: input
    id: system
    attributes:
      label: System
      placeholder: macOS 15, Apple Silicon
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
