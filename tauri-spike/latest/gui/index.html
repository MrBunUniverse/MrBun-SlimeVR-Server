<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, minimum-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <link rel="apple-touch-icon" href="/logo192.png" />

    <link rel="manifest" href="/manifest.json" />

    <title>SlimeVR GUI</title>

    <!-- Paint the right background before any CSS or JS loads (no white flash). -->
    <style>
      html {
        background: #14120e;
      }
      html[data-theme='claude'],
      html[data-theme='trans'] {
        background: #faf9f5;
      }
    </style>
    <script>
      try {
        var hint = localStorage.getItem('slimevr-theme-hint');
        if (hint) document.documentElement.dataset.theme = hint;
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
