[package]
name = "slimevr-tauri-spike"
version = "0.0.0"
description = "Spike: Tauri shell around the existing SlimeVR React GUI"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Size-focused release profile, since binary size is one of the things this spike measures.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
